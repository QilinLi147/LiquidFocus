[metadata]
name = liquidfocus
version = 1.0.0
description = LiquidFocus model and participant-level evaluation code
license = MIT
license_files = LICENSE
url = https://github.com/QilinLi147/LiquidFocus
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24
    pandas>=2.0
    scikit-learn>=1.3
    scipy>=1.10
    torch>=2.5

[options.packages.find]
where = .

[options.extras_require]
faced =
    mne>=1.6
test =
    pytest>=8.0
