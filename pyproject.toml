[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidfocus"
version = "1.0.0"
description = "LiquidFocus model and participant-level evaluation code"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.5"
]

[project.optional-dependencies]
faced = ["mne>=1.6"]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/QilinLi147/LiquidFocus"
Issues = "https://github.com/QilinLi147/LiquidFocus/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["liquidfocus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
